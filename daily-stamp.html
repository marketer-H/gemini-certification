<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNS 도장판</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #f4f0ff;
      min-height: 100vh;
      padding: 24px 16px 60px;
    }

    /* ───── 온보딩 화면 ───── */
    #setupScreen {
      display: none;
      max-width: 360px;
      margin: 60px auto 0;
      background: white;
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 4px 24px rgba(120,80,220,0.13);
      text-align: center;
    }

    #setupScreen h2 {
      font-size: 1.4rem;
      font-weight: 900;
      color: #6c3fc5;
      margin-bottom: 6px;
    }

    #setupScreen p {
      font-size: 0.82rem;
      color: #a090cc;
      margin-bottom: 28px;
    }

    .setup-label {
      text-align: left;
      font-size: 0.8rem;
      font-weight: 700;
      color: #7c5cc8;
      margin-bottom: 6px;
    }

    .setup-input {
      width: 100%;
      border: 1.8px solid #d8c8f8;
      border-radius: 12px;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 0.95rem;
      color: #3a2a6a;
      outline: none;
      margin-bottom: 18px;
      transition: border-color 0.15s;
    }

    .setup-input:focus { border-color: #8b5cf6; }

    .track-row {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .track-emoji-input {
      width: 52px;
      text-align: center;
      border: 1.8px solid #d8c8f8;
      border-radius: 12px;
      padding: 10px 6px;
      font-size: 1.1rem;
      outline: none;
      font-family: inherit;
    }

    .track-emoji-input:focus { border-color: #8b5cf6; }

    .track-label-input {
      flex: 1;
      border: 1.8px solid #d8c8f8;
      border-radius: 12px;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 0.9rem;
      color: #3a2a6a;
      outline: none;
    }

    .track-label-input:focus { border-color: #8b5cf6; }

    .setup-btn {
      width: 100%;
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 900;
      font-family: inherit;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.15s;
    }

    .setup-btn:hover { background: #6d28d9; }

    /* ───── 메인 화면 ───── */
    #mainScreen { display: none; }

    header {
      text-align: center;
      margin-bottom: 24px;
      position: relative;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 900;
      color: #6c3fc5;
      letter-spacing: -0.5px;
    }

    header p {
      margin-top: 6px;
      font-size: 0.83rem;
      color: #9a80cc;
    }

    .settings-btn {
      position: absolute;
      top: 0;
      right: 0;
      background: #ede8ff;
      border: none;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 0.8rem;
      color: #7c5cc8;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
    }

    .settings-btn:hover { background: #ddd4ff; }

    /* 월 네비 */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-bottom: 20px;
    }

    .month-nav button {
      background: #e0d4ff;
      border: none;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      font-size: 1rem;
      cursor: pointer;
      color: #6c3fc5;
      font-weight: 900;
      transition: background 0.15s;
    }

    .month-nav button:hover { background: #c9b8f8; }

    .month-label {
      font-size: 1.15rem;
      font-weight: 900;
      color: #6c3fc5;
      min-width: 120px;
      text-align: center;
    }

    /* 범례 */
    .legend {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: #9070bb;
      font-weight: 700;
    }

    .legend-dot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.88rem;
    }

    .legend-dot.t1 { background: #ede8ff; }
    .legend-dot.t2 { background: #ddf0ff; }

    /* 통계 */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 12px 16px;
      text-align: center;
      box-shadow: 0 2px 10px rgba(120,60,220,0.1);
      min-width: 82px;
    }

    .stat-card .num {
      font-size: 1.8rem;
      font-weight: 900;
      line-height: 1;
    }

    .stat-card.t1 .num { color: #7c3aed; }
    .stat-card.t2 .num { color: #2563eb; }
    .stat-card.combo .num { color: #db2777; }

    .stat-card .label {
      font-size: 0.7rem;
      color: #bbb;
      margin-top: 4px;
      font-weight: 700;
    }

    /* 달력 */
    .calendar-wrap {
      max-width: 420px;
      margin: 0 auto;
    }

    .day-headers {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      margin-bottom: 8px;
    }

    .day-header {
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: #b0a0d0;
      padding: 4px 0;
    }

    .day-header:first-child { color: #db2777; }
    .day-header:last-child  { color: #2563eb; }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .day-cell {
      background: white;
      border-radius: 14px;
      padding: 6px 4px 8px;
      text-align: center;
      box-shadow: 0 1px 6px rgba(120,60,200,0.07);
      min-height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .day-cell.empty { background: transparent; box-shadow: none; }
    .day-cell.today { border: 2px solid #7c3aed; }
    .day-cell.future { opacity: 0.4; }

    .day-num {
      font-size: 0.74rem;
      font-weight: 700;
      color: #a090c8;
      line-height: 1;
    }

    .day-cell.today .day-num {
      background: #7c3aed;
      color: white;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.68rem;
      margin: 0 auto;
    }

    .stamps { display: flex; flex-direction: column; gap: 3px; width: 100%; }

    .stamp-btn {
      width: 100%;
      border: none;
      border-radius: 8px;
      height: 24px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: transform 0.12s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stamp-btn:not(.disabled):active { transform: scale(0.86); }
    .stamp-btn.disabled { cursor: default; opacity: 0.55; }

    .stamp-btn.t1      { background: #ede8ff; color: #7c3aed; }
    .stamp-btn.t1.done { background: #7c3aed; color: white; }
    .stamp-btn.t2      { background: #ddf0ff; color: #2563eb; }
    .stamp-btn.t2.done { background: #2563eb; color: white; }

    @keyframes pop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.28); }
      70%  { transform: scale(0.9); }
      100% { transform: scale(1); }
    }
    .stamp-btn.popping { animation: pop 0.32s ease; }

    .encourage {
      text-align: center;
      margin-top: 26px;
      font-size: 1rem;
      font-weight: 700;
      color: #7c3aed;
      min-height: 1.5em;
    }

    .footer-btn {
      display: block;
      margin: 18px auto 0;
      background: none;
      border: 1.5px solid #d8c8f8;
      color: #b0a0d0;
      font-size: 0.75rem;
      border-radius: 20px;
      padding: 6px 16px;
      cursor: pointer;
      font-family: inherit;
    }

    .footer-btn:hover { background: #f4f0ff; }
  </style>
</head>
<body>

<!-- 온보딩 -->
<div id="setupScreen">
  <h2>💫 SNS 도장판 만들기</h2>
  <p>이름이랑 매일 할 것들을 입력해줘!</p>

  <div class="setup-label">이름</div>
  <input class="setup-input" id="setupName" placeholder="예: 권동글" maxlength="10">

  <div class="setup-label">매일 할 것 1</div>
  <div class="track-row">
    <input class="track-emoji-input" id="emoji1" value="✍️" maxlength="2">
    <input class="track-label-input" id="label1" value="블로그" placeholder="이름" maxlength="8">
  </div>

  <div class="setup-label">매일 할 것 2</div>
  <div class="track-row">
    <input class="track-emoji-input" id="emoji2" value="🧵" maxlength="2">
    <input class="track-label-input" id="label2" value="스레드" placeholder="이름" maxlength="8">
  </div>

  <button class="setup-btn" id="setupSaveBtn">도장판 만들기 💫</button>
</div>

<!-- 메인 -->
<div id="mainScreen">
  <header>
    <h1 id="mainTitle"></h1>
    <p id="mainSubtitle"></p>
    <button class="settings-btn" id="openSettings">⚙️ 설정</button>
  </header>

  <div class="month-nav">
    <button id="prevBtn">‹</button>
    <div class="month-label" id="monthLabel"></div>
    <button id="nextBtn">›</button>
  </div>

  <div class="legend" id="legend"></div>

  <div class="stats-bar" id="statsBar"></div>

  <div class="calendar-wrap">
    <div class="day-headers">
      <div class="day-header">일</div>
      <div class="day-header">월</div>
      <div class="day-header">화</div>
      <div class="day-header">수</div>
      <div class="day-header">목</div>
      <div class="day-header">금</div>
      <div class="day-header">토</div>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
  </div>

  <div class="encourage" id="encourageMsg"></div>
  <button class="footer-btn" id="resetBtn">이번 달 초기화</button>
</div>

<script>
  const CONFIG_KEY  = 'sns_stamp_config';
  const STAMP_KEY   = 'sns_stamp_data';

  const today = new Date();
  let viewYear  = today.getFullYear();
  let viewMonth = today.getMonth();

  const msgs = [
    '오늘도 한 발짝! 💫', '꾸준함이 최고야! ✨', '잘하고 있어요! 👏',
    '완벽한 하루! 🌟', '대단해! 계속 고고~ 🚀', '두 개 다 완료! 짱👍',
    '이러다 인플루언서 되겠는걸 💜', '오늘도 기록은 계속된다 📝',
    '열심히! 계속해줘 🎯', '멋진 하루였어요 💕', '내일도 파이팅! 💪',
  ];

  function randMsg() { return msgs[Math.floor(Math.random() * msgs.length)]; }

  function loadConfig() {
    const r = localStorage.getItem(CONFIG_KEY);
    return r ? JSON.parse(r) : null;
  }

  function saveConfig(cfg) { localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg)); }

  function stampKey(y, m) { return `${STAMP_KEY}_${y}_${m + 1}`; }
  function loadStamps(y, m) { const r = localStorage.getItem(stampKey(y, m)); return r ? JSON.parse(r) : {}; }
  function saveStamps(y, m, d) { localStorage.setItem(stampKey(y, m), JSON.stringify(d)); }

  // ─── 온보딩 ───
  function showSetup(prefill) {
    document.getElementById('mainScreen').style.display = 'none';
    const s = document.getElementById('setupScreen');
    s.style.display = 'block';
    if (prefill) {
      document.getElementById('setupName').value  = prefill.name;
      document.getElementById('emoji1').value     = prefill.items[0].emoji;
      document.getElementById('label1').value     = prefill.items[0].label;
      document.getElementById('emoji2').value     = prefill.items[1].emoji;
      document.getElementById('label2').value     = prefill.items[1].label;
    }
  }

  document.getElementById('setupSaveBtn').addEventListener('click', () => {
    const name  = document.getElementById('setupName').value.trim();
    const e1    = document.getElementById('emoji1').value.trim() || '✍️';
    const l1    = document.getElementById('label1').value.trim() || '항목1';
    const e2    = document.getElementById('emoji2').value.trim() || '🧵';
    const l2    = document.getElementById('label2').value.trim() || '항목2';
    if (!name) { document.getElementById('setupName').focus(); return; }
    const cfg = { name, items: [{ emoji: e1, label: l1 }, { emoji: e2, label: l2 }] };
    saveConfig(cfg);
    showMain(cfg);
  });

  // ─── 메인 ───
  function showMain(cfg) {
    document.getElementById('setupScreen').style.display = 'none';
    document.getElementById('mainScreen').style.display  = 'block';
    document.getElementById('mainTitle').textContent     = `${cfg.name}의 SNS 도장판`;
    document.getElementById('mainSubtitle').textContent  =
      `${cfg.items[0].emoji} ${cfg.items[0].label} + ${cfg.items[1].emoji} ${cfg.items[1].label} 매일매일!`;

    buildLegend(cfg);
    buildStats(cfg);
    renderCalendar(cfg);
  }

  function buildLegend(cfg) {
    const el = document.getElementById('legend');
    el.innerHTML = cfg.items.map((it, i) => `
      <div class="legend-item">
        <div class="legend-dot t${i+1}">${it.emoji}</div>
        <span>${it.label}</span>
      </div>`).join('');
  }

  function buildStats(cfg) {
    const el = document.getElementById('statsBar');
    el.innerHTML = `
      <div class="stat-card t1"><div class="num" id="stat0">0</div><div class="label">${cfg.items[0].label}</div></div>
      <div class="stat-card t2"><div class="num" id="stat1">0</div><div class="label">${cfg.items[1].label}</div></div>
      <div class="stat-card combo"><div class="num" id="statCombo">0</div><div class="label">완벽한 날 💜</div></div>`;
  }

  function renderCalendar(cfg) {
    const data = loadStamps(viewYear, viewMonth);
    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';
    document.getElementById('monthLabel').textContent = `${viewYear}년 ${viewMonth + 1}월`;

    const firstDay    = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const isCurMonth  = viewYear === today.getFullYear() && viewMonth === today.getMonth();
    const todayD      = today.getDate();

    for (let i = 0; i < firstDay; i++) {
      const e = document.createElement('div');
      e.className = 'day-cell empty';
      grid.appendChild(e);
    }

    let counts = [0, 0, 0]; // t1, t2, combo

    for (let d = 1; d <= daysInMonth; d++) {
      const key     = String(d);
      const dayData = data[key] || { t1: false, t2: false };
      if (dayData.t1) counts[0]++;
      if (dayData.t2) counts[1]++;
      if (dayData.t1 && dayData.t2) counts[2]++;

      const isToday  = isCurMonth && d === todayD;
      const isFuture = isCurMonth ? d > todayD
                      : viewYear > today.getFullYear() || (viewYear === today.getFullYear() && viewMonth > today.getMonth());

      const cell = document.createElement('div');
      cell.className = 'day-cell' + (isToday ? ' today' : '') + (isFuture ? ' future' : '');

      const numEl = document.createElement('div');
      numEl.className = 'day-num';
      if (isToday) {
        Object.assign(numEl.style, {
          background: '#7c3aed', color: 'white', width: '20px', height: '20px',
          borderRadius: '50%', display: 'flex', alignItems: 'center',
          justifyContent: 'center', fontSize: '0.68rem', margin: '0 auto',
        });
      }
      numEl.textContent = d;
      cell.appendChild(numEl);

      const stampsDiv = document.createElement('div');
      stampsDiv.className = 'stamps';

      cfg.items.forEach((item, idx) => {
        const tKey = `t${idx + 1}`;
        const btn  = document.createElement('button');
        btn.className = `stamp-btn t${idx + 1}${dayData[tKey] ? ' done' : ''}${isFuture ? ' disabled' : ''}`;
        btn.textContent = item.emoji;
        btn.title = item.label;

        if (!isFuture) {
          btn.addEventListener('click', () => {
            const d2 = loadStamps(viewYear, viewMonth);
            if (!d2[key]) d2[key] = { t1: false, t2: false };
            d2[key][tKey] = !d2[key][tKey];
            saveStamps(viewYear, viewMonth, d2);
            btn.classList.toggle('done', d2[key][tKey]);
            btn.classList.remove('popping');
            void btn.offsetWidth;
            btn.classList.add('popping');
            btn.addEventListener('animationend', () => btn.classList.remove('popping'), { once: true });
            document.getElementById('encourageMsg').textContent = d2[key][tKey] ? randMsg() : '';
            renderStats();
          });
        }
        stampsDiv.appendChild(btn);
      });

      cell.appendChild(stampsDiv);
      grid.appendChild(cell);
    }

    renderStats();
  }

  function renderStats() {
    const data = loadStamps(viewYear, viewMonth);
    let c = [0, 0, 0];
    Object.values(data).forEach(v => {
      if (v.t1) c[0]++;
      if (v.t2) c[1]++;
      if (v.t1 && v.t2) c[2]++;
    });
    const s0 = document.getElementById('stat0');
    const s1 = document.getElementById('stat1');
    const sc = document.getElementById('statCombo');
    if (s0) s0.textContent = c[0];
    if (s1) s1.textContent = c[1];
    if (sc) sc.textContent = c[2];
  }

  document.getElementById('prevBtn').addEventListener('click', () => {
    viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    const cfg = loadConfig(); if (cfg) renderCalendar(cfg);
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    const cfg = loadConfig(); if (cfg) renderCalendar(cfg);
  });

  document.getElementById('openSettings').addEventListener('click', () => {
    showSetup(loadConfig());
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    if (confirm(`${viewYear}년 ${viewMonth + 1}월 도장을 모두 지울까요?`)) {
      localStorage.removeItem(stampKey(viewYear, viewMonth));
      const cfg = loadConfig(); if (cfg) renderCalendar(cfg);
      document.getElementById('encourageMsg').textContent = '';
    }
  });

  // ─── 시작 ───
  const cfg = loadConfig();
  if (cfg) showMain(cfg);
  else showSetup(null);
</script>
</body>
</html>
